# Kubernetes Deployment for Framework Orchestrator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: framework-orchestrator
  labels:
    app: framework-orchestrator
    version: v3.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: framework-orchestrator
  template:
    metadata:
      labels:
        app: framework-orchestrator
        version: v3.1.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: orchestrator
          image: framework-orchestrator:3.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: FO_WORKSPACE
              value: /app/workspace
            - name: FO_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: framework-orchestrator-config
                  key: log_level
                  optional: true
            - name: FO_LOG_FORMAT
              value: json
            - name: FO_METRICS_ENABLED
              value: "true"
            - name: FO_TRACING_ENABLED
              value: "true"
            - name: FO_ENABLE_HEALTH_CHECK
              value: "true"
            - name: FO_AGENT_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: framework-orchestrator-config
                  key: agent_timeout
                  optional: true
            - name: FO_ORCHESTRATION_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: framework-orchestrator-config
                  key: orchestration_timeout
                  optional: true

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: workspace
              mountPath: /app/workspace
            - name: domain-configs
              mountPath: /app/workspace/domains
              readOnly: true

      volumes:
        - name: workspace
          emptyDir: {}
        - name: domain-configs
          configMap:
            name: framework-orchestrator-domains
            optional: true

      terminationGracePeriodSeconds: 30
