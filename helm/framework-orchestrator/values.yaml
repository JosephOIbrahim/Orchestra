# Default values for framework-orchestrator
# This is a YAML-formatted file.

# Number of replicas
replicaCount: 1

image:
  repository: ghcr.io/josephoibrahim/framework-orchestrator
  pullPolicy: IfNotPresent
  # Overrides the image tag (default is appVersion from Chart.yaml)
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: framework-orchestrator.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: framework-orchestrator-tls
  #    hosts:
  #      - framework-orchestrator.local

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Framework Orchestrator configuration
config:
  # Logging
  logLevel: INFO
  logFormat: json

  # Agent configuration
  maxParallelAgents: 3
  defaultTimeout: 30

  # Resilience
  circuitBreakerFailureThreshold: 5
  circuitBreakerResetTimeout: 60
  retryMaxAttempts: 3
  retryBaseDelay: 1.0
  retryJitter: 0.1

  # Rate limiting
  rateLimitRequests: 100
  rateLimitWindow: 60

  # Bulkhead
  bulkheadMaxConcurrent: 5
  bulkheadQueueSize: 20

  # Checkpointing
  enableCheckpoints: true
  checkpointDir: /data/checkpoints

  # Domain configs path (mount as volume)
  domainsPath: /config/domains

# Probes configuration
probes:
  liveness:
    path: /live
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Persistence for checkpoints
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

# ConfigMap for domain configurations
domainConfigs:
  enabled: true
  # Domain configs as YAML (will be converted to JSON)
  configs:
    general:
      name: General
      description: Fallback domain for unmatched tasks
      specialists: {}

# Prometheus ServiceMonitor (requires prometheus-operator)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Prometheus alerting rules (requires prometheus-operator)
prometheusRule:
  enabled: false
  labels: {}
  # Rules are loaded from prometheus/alerts.yml

# OpenTelemetry configuration
opentelemetry:
  enabled: false
  endpoint: ""
  # endpoint: "http://otel-collector:4317"
